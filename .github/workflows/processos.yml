name: Robô — processos da Região Sul

# Monta a base de PROCESSOS (contratações) de PR, SC e RS publicados no PNCP
# nos últimos 12 meses, que a tela do PNCP de Ijuí lê nas camadas "Região
# Sul" e "Rio Grande do Sul". Só a contratação: os itens a tela busca no PNCP
# na hora, quando alguém abre o processo.
#
#   listar   — uma máquina por UF (cada uma com o seu endereço: o limite de
#              requisições do PNCP é por endereço)
#   publicar — junta as UFs, tira o que passou de 12 meses e grava no ramo
#              "processos" (sempre um commit só)
#
# A carga inicial pode não caber numa rodada: a seguinte (a cada 4 h enquanto
# houver carga pendente) continua de onde parou.
on:
  schedule:
    - cron: "40 6 * * *"      # todo dia, 03:40 em Brasília
    - cron: "10 2-22/4 * * *" # a cada 4 h, só enquanto a carga inicial não termina
  workflow_dispatch:
    inputs:
      orcamento:
        description: "Minutos de trabalho de cada máquina"
        type: number
        default: 300
  push:
    branches: [main]
    paths: ["robo/processos.mjs", "robo/teste-processos.mjs", ".github/workflows/processos.yml"]

permissions:
  contents: write

concurrency:
  group: processos
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pular: ${{ steps.p.outputs.pular }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node robo/teste-processos.mjs
      - name: O PNCP responde daqui?
        continue-on-error: true
        run: |
          U="https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=$(date -d '-7 days' +%Y%m%d)&dataFinal=$(date +%Y%m%d)&codigoModalidadeContratacao=8&uf=RS&pagina=1&tamanhoPagina=10"
          curl -sS -m 60 -o /dev/null -w "curl: HTTP %{http_code} de %{remote_ip} em %{time_total}s\n" "$U" || echo "curl falhou"
          node -e 'fetch(process.argv[1],{signal:AbortSignal.timeout(60000)}).then(r=>console.log("node: HTTP",r.status)).catch(e=>console.log("node falhou:",e.message,e.cause&&(e.cause.code||e.cause.message)))' "$U"
      - name: Estado atual (ramo processos)
        run: |
          mkdir -p proc-estado
          git fetch --depth=1 origin processos && git checkout FETCH_HEAD -- estado && cp -r estado/. proc-estado/ || echo "Sem estado ainda: primeira carga."
      - name: Há trabalho?
        id: p
        run: |
          if [ "${{ github.event.schedule }}" = "10 2-22/4 * * *" ] && node -e '
            const fs=require("fs");const p=["RS","SC","PR"].some(u=>{try{return JSON.parse(fs.readFileSync("proc-estado/cursor-"+u+".json","utf8")).pendente!==false}catch(e){return true}});
            process.exit(p?1:0)'; then
            echo "Carga completa — a rodada extra não tem o que fazer."; echo "pular=1" >> "$GITHUB_OUTPUT"
          fi

  listar:
    needs: preparar
    if: needs.preparar.outputs.pular != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        uf: [RS, SC, PR]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p proc-estado
          git fetch --depth=1 origin processos && git checkout FETCH_HEAD -- estado && cp -r estado/. proc-estado/ || true
      - name: Listar ${{ matrix.uf }}
        timeout-minutes: 320
        run: node robo/processos.mjs listar
        env:
          UF: ${{ matrix.uf }}
          ORCAMENTO_MIN: ${{ inputs.orcamento || 300 }}
          SIMULTANEAS: 2
          INTERVALO_MS: 400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proc-${{ matrix.uf }}
          path: |
            trab/proc-${{ matrix.uf }}.json.gz
            trab/cursor-${{ matrix.uf }}.json
          retention-days: 3
          if-no-files-found: ignore

  publicar:
    needs: [preparar, listar]
    if: always() && needs.preparar.outputs.pular != '1' && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p proc-estado
          git fetch --depth=1 origin processos && git checkout FETCH_HEAD -- estado && cp -r estado/. proc-estado/ || true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: proc-*
          path: trab
          merge-multiple: true
      - name: Montar a base
        run: node robo/processos.mjs publicar
      - name: Gravar no ramo processos (um commit só)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f proc-web/meta.json
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp -r proc-estado /tmp/pub/estado && cp -r proc-web /tmp/pub/web
          cd /tmp/pub
          git init -q -b processos
          git config user.name "Robô de processos da Região Sul"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Processos de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" processos
