name: Robô — preços dos municípios do RS

# Chama o robô de uma UF (robo-uf.yml) para RS: base no ramo "dados".
on:
  schedule:
    - cron: "15 11 * * *"      # todo dia, 08:15 em Brasília (de madrugada o PNCP recusa o GitHub)
    - cron: "45 13-23/4 * * *" # 10h45, 14h45 e 18h45 em Brasília, só se ainda houver carga pendente
  workflow_dispatch:
    inputs:
      orcamento:
        description: "Minutos de trabalho de cada máquina que baixa"
        type: number
        default: 300
      so_publicar:
        description: "Só remontar a base a partir do estado (sem baixar do PNCP)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["robo/**", ".github/workflows/robo.yml", ".github/workflows/robo-uf.yml"]

permissions:
  contents: write

concurrency:
  group: robo-rs
  cancel-in-progress: false

jobs:
  robo:
    uses: ./.github/workflows/robo-uf.yml
    with:
      uf: RS
      ramo: dados
      cron_extra: "45 13-23/4 * * *"
      orcamento: ${{ fromJSON(inputs.orcamento || 300) }}
      so_publicar: ${{ github.event_name == 'push' || inputs.so_publicar == true }}
