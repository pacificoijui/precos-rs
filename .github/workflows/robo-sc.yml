name: Robô — preços dos municípios de SC

# Chama o robô de uma UF (robo-uf.yml) para SC: base no ramo "dados-sc".
on:
  schedule:
    - cron: "35 11 * * *"      # todo dia, 08:35 em Brasília
    - cron: "5 14-22/4 * * *" # 11h05, 15h05 e 19h05 em Brasília, só se ainda houver carga pendente
  workflow_dispatch:
    inputs:
      orcamento:
        description: "Minutos de trabalho de cada máquina que baixa"
        type: number
        default: 300
      so_publicar:
        description: "Só remontar a base a partir do estado (sem baixar do PNCP)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robo-sc
  cancel-in-progress: false

jobs:
  robo:
    uses: ./.github/workflows/robo-uf.yml
    with:
      uf: SC
      ramo: dados-sc
      cron_extra: "5 14-22/4 * * *"
      orcamento: ${{ fromJSON(inputs.orcamento || 300) }}
      so_publicar: ${{ inputs.so_publicar == true }}
